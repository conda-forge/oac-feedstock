schema_version: 1

context:
  python_min: "3.11"
  version: "2.8.3"

package:
  name: oac
  version: ${{ version }}

source:
  url: https://github.com/dlr-pa/oac/archive/v${{ version }}.tar.gz
  sha256: d0a8fabe3d8c8fe78509e8db54b30856b46e68b321711be35a75e133b717563c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}
    - setuptools
    - joblib
    - numpy
    - pandas
    - toml
    - matplotlib-base
    - cf-units
    - xarray
    - netcdf4
    - scipy
    - deepmerge
    - ambiance

tests:
  - python:
      imports:
        - openairclim
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: OpenAirClim is a model for simplified evaluation of the approximate chemistry-climate impact of air traffic emissions.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dlr-pa/oac

extra:
  recipe-maintainers:
    - ocefpaf
